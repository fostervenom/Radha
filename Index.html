<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c0a09">
    <title>Radha Naam Jaap</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'devanagari': ['"Noto Serif Devanagari"', 'serif'],
                        'serif': ['Georgia', '"Times New Roman"', 'serif']
                    },
                    colors: {
                        stone: { 850: '#1c1917', 900: '#151311', 950: '#0c0a09' }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            background-color: #0c0a09;
            overscroll-behavior: none;
        }
        
        /* Animations */
        @keyframes ripple-effect {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .ripple {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            animation: ripple-effect 0.7s ease-out forwards;
            pointer-events: none;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .animate-bump {
            animation: bump 0.15s ease-out;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .mic-listening {
            animation: pulse-ring 2s infinite;
            border-color: #f59e0b !important;
            color: #fbbf24 !important;
        }

        /* Flying Text Class */
        .flying-text {
            position: fixed;
            color: #fbbf24;
            font-family: Georgia, serif;
            font-weight: bold;
            font-size: 1.25rem;
            pointer-events: none;
            z-index: 50;
            opacity: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: transform 1s ease-out, opacity 1s ease-out;
        }
    </style>
</head>

<body class="min-h-[100dvh] w-full flex flex-col items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-stone-800 to-stone-950 text-stone-200 overflow-hidden p-4 relative">

    <div class="text-amber-500 text-4xl md:text-5xl mb-2 font-devanagari drop-shadow-md">ॐ</div>
    <h1 class="text-lg md:text-xl font-light tracking-[0.3em] text-stone-300 uppercase mb-8 text-center drop-shadow-sm">
        Radha Naam Jaap
    </h1>

    <div class="flex flex-col items-center mb-10 w-full max-w-sm">
        <span id="welcomeText" class="text-xs text-stone-400 mb-2 tracking-[0.2em] uppercase font-medium">Today's Jaap</span>
        <div id="counterDisplay" class="text-7xl md:text-8xl font-bold text-amber-500 tabular-nums drop-shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-transform">
            0
        </div>
    </div>

    <button id="tapButton" class="relative group w-48 h-48 md:w-56 md:h-56 rounded-full bg-gradient-to-br from-stone-700 to-stone-900 border border-stone-600 shadow-[0_0_50px_rgba(0,0,0,0.6)] flex items-center justify-center active:scale-95 transition-all duration-200 outline-none select-none z-10" aria-label="Tap to count Radha">
        <div class="absolute inset-0 rounded-full ring-4 ring-amber-600/10 group-active:ring-amber-500/30 transition-all duration-200 pointer-events-none"></div>
        <span class="text-3xl md:text-4xl font-serif text-amber-400/90 tracking-widest drop-shadow-md z-20 pointer-events-none">RADHA</span>
        <div id="rippleContainer" class="absolute inset-0 rounded-full pointer-events-none z-0"></div>
    </button>

    <div class="mt-12 flex flex-col items-center w-full">
        <button id="voiceToggle" class="flex items-center justify-center gap-3 w-64 px-6 py-3.5 rounded-full bg-stone-800/80 border border-stone-700 text-stone-300 hover:bg-stone-800 hover:text-amber-400 hover:border-stone-500 transition-all shadow-lg outline-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
            <span id="voiceText" class="text-sm font-medium tracking-wide">Start Voice Jaap</span>
        </button>
        <div id="statusText" class="mt-4 text-xs text-stone-500 font-medium h-4 text-center">
            Tap the microphone to chant continuously
        </div>
    </div>

    <button id="resetButton" class="mt-8 text-xs text-stone-600 hover:text-stone-400 transition-colors py-2 px-4 uppercase tracking-widest outline-none">
        Reset Counter
    </button>

    <script>
        "use strict";

        // --- DOM Elements ---
        const counterDisplay = document.getElementById('counterDisplay');
        const tapButton = document.getElementById('tapButton');
        const rippleContainer = document.getElementById('rippleContainer');
        const voiceToggle = document.getElementById('voiceToggle');
        const voiceText = document.getElementById('voiceText');
        const statusText = document.getElementById('statusText');
        const resetButton = document.getElementById('resetButton');
        const welcomeText = document.getElementById('welcomeText');

        // --- State ---
        let count = parseInt(localStorage.getItem('radhaJaapCount') || '0', 10);
        let userName = localStorage.getItem('jaapUserName') || "";
        let isListening = false;
        let recognition = null;
        let resultCounts = {}; 
        let wakeLock = null;

        // --- Initialization ---
        function initUser() {
            if (!userName) {
                userName = prompt("Welcome! Please enter your name for the Naam Jaap:") || "Devotee";
                localStorage.setItem('jaapUserName', userName);
            }
            welcomeText.innerText = `${userName}'s Jaap`;
            updateCounterUI(false);
        }
        initUser();

        // --- Core Functions ---
        function updateCounterUI(animate = true) {
            counterDisplay.innerText = count.toLocaleString('en-IN');
            localStorage.setItem('radhaJaapCount', count.toString());

            if (animate) {
                counterDisplay.classList.remove('animate-bump');
                void counterDisplay.offsetWidth; // Trigger reflow
                counterDisplay.classList.add('animate-bump');
            }
        }

        function triggerAnimations() {
            // Ripple
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);

            // Flying Text
            const flyText = document.createElement('div');
            flyText.className = 'flying-text';
            flyText.innerText = `RADHA ${userName}`;
            
            // Start from center of button
            const btnRect = tapButton.getBoundingClientRect();
            const startX = btnRect.left + btnRect.width / 2;
            const startY = btnRect.top + btnRect.height / 2;
            
            flyText.style.left = startX + 'px';
            flyText.style.top = startY + 'px';
            flyText.style.transform = 'translate(-50%, -50%) scale(0.5)';
            document.body.appendChild(flyText);

            // Calculate random angle and distance
            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * 150;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            // Trigger CSS transition
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flyText.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.2)`;
                    flyText.style.opacity = '0';
                });
            });

            setTimeout(() => flyText.remove(), 1000); // Cleanup DOM
        }

        function handleJaap() {
            count++;
            updateCounterUI(true);
            triggerAnimations();
        }

        // --- Manual Interaction ---
        tapButton.addEventListener('click', handleJaap);
        resetButton.addEventListener('click', () => {
            if (confirm("Reset your Jaap counter to 0?")) {
                count = 0;
                updateCounterUI(false);
            }
        });

        // --- Wake Lock for Screen Sleep ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn('Wake Lock error:', err);
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // --- Voice Recognition Logic ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Your browser does not support Speech Recognition. Please update your browser or switch to Google Chrome / Microsoft Edge for the Voice Jaap feature.");
            voiceToggle.style.display = 'none';
            statusText.innerHTML = "Voice Jaap not supported. Please update browser.";
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                resultCounts = {}; // Reset counts on fresh start
                requestWakeLock();
                voiceToggle.classList.add('mic-listening');
                voiceToggle.classList.replace('bg-stone-800/80', 'bg-stone-900');
                voiceText.innerText = "Listening... Chant Radha";
                statusText.innerHTML = "<span class='text-amber-500'>Continuous mode active.</span>";
            };

            recognition.onresult = (event) => {
                // To prevent lag, if results get massive, force a restart
                if (event.results.length > 30) {
                    recognition.stop();
                    return;
                }

                // Process strictly per index to avoid double counting interim vs final
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    const matches = transcript.match(/(radha|radhe|राधा|राधे)/gi);
                    const matchCount = matches ? matches.length : 0;

                    const previousCount = resultCounts[i] || 0;
                    if (matchCount > previousCount) {
                        const newJaaps = matchCount - previousCount;
                        for (let j = 0; j < newJaaps; j++) {
                            handleJaap();
                        }
                        resultCounts[i] = matchCount; // Update memory for this specific phrase
                    }
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    stopListening();
                    alert("Microphone access denied. Please allow microphone permissions in your browser settings.");
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    // Seamless restart to prevent lag buildup and keep it infinite
                    resultCounts = {}; 
                    try { recognition.start(); } 
                    catch (e) { setTimeout(() => { if (isListening) recognition.start(); }, 500); }
                } else {
                    releaseWakeLock();
                    voiceToggle.classList.remove('mic-listening');
                    voiceToggle.classList.replace('bg-stone-900', 'bg-stone-800/80');
                    voiceText.innerText = "Start Voice Jaap";
                    statusText.innerText = "Microphone stopped.";
                }
            };
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
        }

        function startListening() {
            if (recognition) {
                try { recognition.start(); } 
                catch (e) { console.log("Recognition already active"); }
            }
        }

        voiceToggle.addEventListener('click', () => {
            if (isListening) stopListening();
            else startListening();
        });

        // Visibility Change Handler (Save Battery / Re-acquire Wake Lock)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                releaseWakeLock();
                if (isListening && recognition) recognition.stop(); 
            } else if (!document.hidden && isListening) {
                startListening();
            }
        });
    </script>
</body>
</html>
