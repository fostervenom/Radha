<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c0a09">
    <title>Radha Naam Jaap</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'devanagari': ['"Noto Serif Devanagari"', 'serif'],
                        'serif': ['Georgia', '"Times New Roman"', 'serif']
                    },
                    colors: {
                        stone: {
                            850: '#1c1917',
                            900: '#151311',
                            950: '#0c0a09',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: #0c0a09;
            overscroll-behavior: none;
        }

        /* Animations */
        @keyframes ripple-effect {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .ripple {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #f59e0b; /* Amber 500 */
            animation: ripple-effect 0.7s ease-out forwards;
            pointer-events: none;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .animate-bump {
            animation: bump 0.15s ease-out;
        }

        /* Mic Pulse */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .mic-listening {
            animation: pulse-ring 2s infinite;
            border-color: #f59e0b !important;
            color: #fbbf24 !important;
        }
    </style>
</head>

<body class="min-h-[100dvh] w-full flex flex-col items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-stone-800 to-stone-950 text-stone-200 overflow-hidden p-4">

    <!-- Meditative Header -->
    <div class="text-amber-500 text-4xl md:text-5xl mb-2 font-devanagari drop-shadow-md">ॐ</div>
    <h1 class="text-lg md:text-xl font-light tracking-[0.3em] text-stone-300 uppercase mb-8 text-center drop-shadow-sm">
        Radha Naam Jaap
    </h1>

    <!-- Counter Display -->
    <div class="flex flex-col items-center mb-10 w-full max-w-sm">
        <span class="text-xs text-stone-400 mb-2 tracking-[0.2em] uppercase font-medium">Today's Jaap</span>
        <div 
            id="counterDisplay" 
            class="text-7xl md:text-8xl font-bold text-amber-500 tabular-nums drop-shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-transform"
        >
            0
        </div>
    </div>

    <!-- Main Tap Button -->
    <button 
        id="tapButton" 
        class="relative group w-48 h-48 md:w-56 md:h-56 rounded-full bg-gradient-to-br from-stone-700 to-stone-900 border border-stone-600 shadow-[0_0_50px_rgba(0,0,0,0.6)] flex items-center justify-center active:scale-95 transition-all duration-200 outline-none select-none z-10"
        aria-label="Tap to count Radha"
    >
        <!-- Static outer glow ring -->
        <div class="absolute inset-0 rounded-full ring-4 ring-amber-600/10 group-active:ring-amber-500/30 transition-all duration-200 pointer-events-none"></div>
        
        <span class="text-3xl md:text-4xl font-serif text-amber-400/90 tracking-widest drop-shadow-md z-20 pointer-events-none">RADHA</span>
        
        <!-- Container for dynamically injected ripples -->
        <div id="rippleContainer" class="absolute inset-0 rounded-full pointer-events-none z-0"></div>
    </button>

    <!-- Voice Detection Toggle -->
    <div class="mt-12 flex flex-col items-center w-full">
        <button 
            id="voiceToggle" 
            class="flex items-center justify-center gap-3 w-64 px-6 py-3.5 rounded-full bg-stone-800/80 border border-stone-700 text-stone-300 hover:bg-stone-800 hover:text-amber-400 hover:border-stone-500 transition-all shadow-lg outline-none"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
            <span id="voiceText" class="text-sm font-medium tracking-wide">Start Voice Jaap</span>
        </button>
        <div id="statusText" class="mt-4 text-xs text-stone-500 font-medium h-4 text-center">
            Tap the microphone to chant continuously
        </div>
    </div>

    <!-- Reset Data -->
    <button id="resetButton" class="mt-8 text-xs text-stone-600 hover:text-stone-400 transition-colors py-2 px-4 uppercase tracking-widest outline-none">
        Reset Counter
    </button>

    <script>
        "use strict";

        // --- DOM Elements ---
        const counterDisplay = document.getElementById('counterDisplay');
        const tapButton = document.getElementById('tapButton');
        const rippleContainer = document.getElementById('rippleContainer');
        const voiceToggle = document.getElementById('voiceToggle');
        const voiceText = document.getElementById('voiceText');
        const statusText = document.getElementById('statusText');
        const resetButton = document.getElementById('resetButton');

        // --- State ---
        let count = parseInt(localStorage.getItem('radhaJaapCount') || '0', 10);
        let isListening = false;
        let recognition = null;
        let sessionKeywordCount = 0; // Tracks occurrences per voice session to fix delay

        // Init UI
        updateCounterUI(false);

        // --- Core Functions ---
        function updateCounterUI(animate = true) {
            counterDisplay.innerText = count.toLocaleString('en-IN');
            localStorage.setItem('radhaJaapCount', count.toString());

            if (animate) {
                counterDisplay.classList.remove('animate-bump');
                void counterDisplay.offsetWidth; // Trigger reflow
                counterDisplay.classList.add('animate-bump');
            }
        }

        function triggerRipple() {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            rippleContainer.appendChild(ripple);
            
            // Remove element after animation ends
            setTimeout(() => {
                ripple.remove();
            }, 700);
        }

        function handleJaap() {
            count++;
            updateCounterUI(true);
            triggerRipple();
        }

        // --- Manual Interaction ---
        tapButton.addEventListener('click', handleJaap);

        resetButton.addEventListener('click', () => {
            if (confirm("Reset your Jaap counter to 0?")) {
                count = 0;
                updateCounterUI(false);
            }
        });

        // --- Voice Recognition Logic (Real-time Fix) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            voiceToggle.style.display = 'none';
            statusText.innerHTML = "Voice Jaap not supported in this browser. Please use Chrome/Edge.";
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = true;
            recognition.interimResults = true; // Use interim for zero-delay counting!

            recognition.onstart = () => {
                isListening = true;
                sessionKeywordCount = 0;
                voiceToggle.classList.add('mic-listening');
                voiceToggle.classList.replace('bg-stone-800/80', 'bg-stone-900');
                voiceText.innerText = "Listening... Chant Radha";
                statusText.innerHTML = "<span class='text-amber-500'>Continuous mode active.</span>";
            };

            recognition.onresult = (event) => {
                let fullTranscript = "";
                
                // Combine all current results (interim and final)
                for (let i = 0; i < event.results.length; i++) {
                    fullTranscript += event.results[i][0].transcript + " ";
                }

                // Match instances of Radha/Radhe (English or Hindi)
                const matches = fullTranscript.match(/(radha|radhe|राधा|राधे)/gi);
                const currentTotalMatches = matches ? matches.length : 0;

                // If new instances are found in this continuous buffer, increment instantly
                if (currentTotalMatches > sessionKeywordCount) {
                    const newJaaps = currentTotalMatches - sessionKeywordCount;
                    for (let j = 0; j < newJaaps; j++) {
                        handleJaap();
                    }
                    sessionKeywordCount = currentTotalMatches;
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    stopListening();
                    statusText.innerHTML = "<span class='text-red-500'>Microphone access denied.</span>";
                }
            };

            recognition.onend = () => {
                // To maintain a truly continuous loop without delay, automatically restart 
                // if the user hasn't explicitly stopped it.
                if (isListening) {
                    sessionKeywordCount = 0; // Reset session count for the fresh buffer
                    try {
                        recognition.start();
                    } catch (e) {
                        // In case of rapid restart failure
                        setTimeout(() => { if (isListening) recognition.start(); }, 500);
                    }
                } else {
                    voiceToggle.classList.remove('mic-listening');
                    voiceToggle.classList.replace('bg-stone-900', 'bg-stone-800/80');
                    voiceText.innerText = "Start Voice Jaap";
                    statusText.innerText = "Microphone stopped.";
                }
            };
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Recognition already active");
                }
            }
        }

        voiceToggle.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                statusText.innerText = "Initializing microphone...";
                startListening();
            }
        });

        // Pause listening automatically if the page is hidden to save battery
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isListening) {
                recognition.stop(); 
            } else if (!document.hidden && isListening) {
                startListening();
            }
        });
    </script>
</body>
</html>
